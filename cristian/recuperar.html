<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recuperar senha</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
height:100vh;

display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:30px;
border-radius:12px;
width:350px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
background:#2d8a60;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Recuperar senha</h2>

<form id="formRecuperar">

<input
type="email"
id="email"
placeholder="Digite seu email"
required
>

<button type="submit">

Enviar código

</button>

</form>

</div>

<script>

document
.getElementById("formRecuperar")
.addEventListener(
"submit",
function(e){

e.preventDefault();

const email =
document.getElementById("email").value;

// gera token
const token =
Math.random()
.toString(36)
.substring(2,8)
.toUpperCase();

// salva
localStorage.setItem(
"resetToken",
token
);

localStorage.setItem(
"resetEmail",
email
);

// simula envio
alert(

`Código enviado!

Token: ${token}`

);

// vai para próxima página
window.location.href =
"nova-senha.html";

});

</script>

</body>
</html>
