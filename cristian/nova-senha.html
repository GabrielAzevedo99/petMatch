<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova senha</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
height:100vh;

display:flex;
justify-content:center;
align-items:center;
}

.card{
background:white;
padding:30px;
border-radius:12px;
width:350px;
}

input{
width:100%;
padding:12px;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
background:#2d8a60;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<h2>Nova senha</h2>

<form id="formNovaSenha">

<input
type="text"
id="token"
placeholder="Digite o token"
required
>

<input
type="password"
id="senha"
placeholder="Nova senha"
required
>

<input
type="password"
id="confirmarSenha"
placeholder="Confirmar senha"
required
>

<button type="submit">

Alterar senha

</button>

</form>

</div>

<script>

const senhaRegex =
/^(?=.*[!@#$%^&*]).{6,}$/;

document
.getElementById("formNovaSenha")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const token =
document.getElementById("token").value;

const senha =
document.getElementById("senha").value;

const confirmarSenha =
document.getElementById("confirmarSenha").value;

const tokenSalvo =
localStorage.getItem("resetToken");

const email =
localStorage.getItem("resetEmail");

// valida token
if(token !== tokenSalvo){

alert("Token inválido");
return;

}

// valida senha
if(!senhaRegex.test(senha)){

alert(
"Senha precisa ter 6+ caracteres e símbolo"
);

return;

}

// confirma senha
if(senha !== confirmarSenha){

alert("As senhas não coincidem");
return;

}

// envia para php
const resposta = await fetch(
"./petmatch-api/resetar-senha.php",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
email,
novaSenha:senha
})

}
);

const data =
await resposta.json();

alert(data.message);

if(data.success){

localStorage.removeItem("resetToken");
localStorage.removeItem("resetEmail");

window.location.href =
"login.html";

}

});

</script>

</body>
</html>
